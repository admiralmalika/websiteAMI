<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog & Stok Produk | StoreAdmin Panel</title>
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/store-admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="store-admin-body">

  <aside class="store-admin-sidebar">
    <div class="store-admin-brand">
      <div class="store-logo-badge">STORE</div>
      <div>
        <div style="font-weight: 800; font-size: 1rem; color: #fff;">STORE ADMIN</div>
        <div style="font-size: 0.7rem; color: #10b981;">store.admiralmalika.com</div>
      </div>
    </div>
    <nav class="store-admin-nav">
      <a href="index.html" class="store-admin-link"><i class="fas fa-chart-line"></i> Store Overview</a>
      <a href="categories.html" class="store-admin-link"><i class="fas fa-tags"></i> Kategori Produk Dinamis</a>
      <a href="products.html" class="store-admin-link active"><i class="fas fa-boxes"></i> Katalog Produk & Stok</a>
      <a href="orders.html" class="store-admin-link"><i class="fas fa-shopping-bag"></i> Pesan & Transaksi Retail</a>
      <a href="payment-settings.html" class="store-admin-link"><i class="fas fa-credit-card"></i> Pengaturan Pembayaran</a>
    </nav>
  </aside>

  <main class="store-admin-main">
    <header class="store-admin-header">
      <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a;">Manajemen Katalog Produk & Stok Retail</h3>
      <button class="btn btn-primary btn-sm" onclick="promptAddProduct()"><i class="fas fa-plus"></i> + Tambah Produk Baru</button>
    </header>

    <div class="store-admin-content">
      <div class="store-admin-card">
        <h4 style="font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-bottom: 1.5rem;">Katalog Barang Retail Active</h4>

        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="background: #f8fafc; text-align: left;">
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Nama Produk</th>
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Kategori</th>
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Harga Retail</th>
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Kemasan Unit</th>
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Stok</th>
              <th style="padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;">Aksi</th>
            </tr>
          </thead>
          <tbody id="st-products-tbody">
            <!-- Rendered from store.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/store.js"></script>
  <script src="../js/store-admin.js"></script>
  <script>
    function renderProductTable() {
      const store = getStoreData();
      const tbody = document.getElementById('st-products-tbody');

      tbody.innerHTML = store.products.map(p => {
        const catObj = store.categories.find(c => c.id === p.category);
        const catName = catObj ? catObj.name : p.category;

        return `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="font-weight: 700; color: #0f172a;">${p.name}</td>
            <td><span class="badge-status badge-active" style="background:#dbeafe; color:#1e40af;">${catName}</span></td>
            <td style="font-weight: 800; color: #059669;">${formatRupiah(p.price)}</td>
            <td style="font-size: 0.85rem; color: #64748b;">${p.unit}</td>
            <td style="font-weight: 700;">${p.stock}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="handleDeleteProduct('${p.id}')" style="padding: 0.25rem 0.6rem; color:#ef4444; border-color:#ef4444;"><i class="fas fa-trash"></i> Hapus</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function promptAddProduct() {
      const store = getStoreData();
      const name = prompt('Nama Produk Retail:');
      if (!name) return;

      const categoryOptions = store.categories.map((c, i) => `${i + 1}. ${c.name} (${c.id})`).join('\n');
      const catChoice = prompt(`Pilih Kategori (masukkan ID kategori):\n\n${categoryOptions}`, store.categories[1] ? store.categories[1].id : 'cat-agraria');
      
      const price = prompt('Harga Produk (Rp):', '25000');
      const unit = prompt('Satuan Kemasan (misal: Pack 500g / Pouch 1kg):', 'Pack 500g');
      const stock = prompt('Kuantitas Stok:', '100');
      const description = prompt('Deskripsi Produk Singkat:', 'Produk berkualitas tinggi dari Admiral Malika.');

      addProduct({ name, category: catChoice, price, unit, stock, description });
      renderProductTable();
      alert(`Produk "${name}" berhasil ditambahkan ke katalog toko online!`);
    }

    function handleDeleteProduct(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        deleteProduct(id);
        renderProductTable();
      }
    }

    document.addEventListener('DOMContentLoaded', renderProductTable);
  </script>
</body>
</html>
