<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja | Admiral Store</title>
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="../company-profile/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="store-body">

  <nav class="store-navbar">
    <div class="store-nav-container">
      <a href="index.html" class="store-logo">
        <div class="store-logo-badge">ADMIRAL</div>
        <div style="font-weight: 800; font-size: 1.1rem; color: var(--store-navy);">STORE</div>
      </a>
      <a href="index.html" style="color: var(--store-muted); font-weight: 600; text-decoration: none;">&larr; Lanjut Belanja</a>
    </div>
  </nav>

  <main style="max-width: 950px; margin: 3rem auto; padding: 0 1.5rem;">
    <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--store-navy); margin-bottom: 1.5rem;">Keranjang Belanja Anda</h2>

    <div style="background: #fff; border-radius: 16px; border: 1px solid var(--store-border); padding: 2rem; box-shadow: var(--shadow-sm);">
      <div id="cart-items-container">
        <!-- Rendered from store.js -->
      </div>

      <div id="cart-summary-box" style="margin-top: 2rem; padding-top: 1.5rem; border-top: 2px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span style="color: #64748b; font-size: 0.9rem;">Total Ringkasan Belanja:</span>
          <div style="font-size: 1.8rem; font-weight: 800; color: var(--store-emerald);" id="cart-total-price">Rp 0</div>
        </div>
        <div style="display: flex; gap: 1rem;">
          <button class="btn btn-outline" onclick="clearCart()"><i class="fas fa-trash"></i> Kosongkan</button>
          <a href="checkout.html" class="btn btn-primary" id="btn-proceed-checkout"><i class="fas fa-credit-card"></i> Lanjut Ke Checkout Hybrid &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCartView);

    function renderCartView() {
      const cart = getCart();
      const container = document.getElementById('cart-items-container');
      const totalPriceEl = document.getElementById('cart-total-price');

      if (cart.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 3rem; color: #94a3b8;"><i class="fas fa-shopping-cart" style="font-size:3rem; margin-bottom:1rem;"></i><br>Keranjang belanja Anda masih kosong.</div>`;
        totalPriceEl.textContent = 'Rp 0';
        document.getElementById('btn-proceed-checkout').style.pointerEvents = 'none';
        document.getElementById('btn-proceed-checkout').style.opacity = '0.5';
        return;
      }

      document.getElementById('btn-proceed-checkout').style.pointerEvents = 'auto';
      document.getElementById('btn-proceed-checkout').style.opacity = '1';

      let total = 0;
      container.innerHTML = cart.map(item => {
        const itemSubtotal = item.price * item.qty;
        total += itemSubtotal;
        return `
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #f1f5f9; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <div style="width: 50px; height: 50px; background: #f8fafc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--store-emerald);">
                <i class="fas ${item.icon || 'fa-box'}"></i>
              </div>
              <div>
                <h4 style="font-weight: 700; font-size: 1rem; color: var(--store-navy); margin: 0;">${item.name}</h4>
                <span style="font-size: 0.82rem; color: #64748b;">${formatRupiah(item.price)} / ${item.unit}</span>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 1.5rem;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <button class="btn btn-outline btn-sm" onclick="changeQty('${item.id}', -1)" style="padding: 0.2rem 0.6rem;">-</button>
                <span style="font-weight: 800; min-width: 24px; text-align: center;">${item.qty}</span>
                <button class="btn btn-outline btn-sm" onclick="changeQty('${item.id}', 1)" style="padding: 0.2rem 0.6rem;">+</button>
              </div>

              <div style="font-weight: 800; font-size: 1.1rem; color: var(--store-emerald); min-width: 120px; text-align: right;">
                ${formatRupiah(itemSubtotal)}
              </div>

              <button style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem;" onclick="removeItem('${item.id}')"><i class="fas fa-times-circle"></i></button>
            </div>
          </div>
        `;
      }).join('');

      totalPriceEl.textContent = formatRupiah(total);
    }

    function changeQty(id, delta) {
      let cart = getCart();
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      saveCart(cart);
      renderCartView();
    }

    function removeItem(id) {
      let cart = getCart();
      cart = cart.filter(i => i.id !== id);
      saveCart(cart);
      renderCartView();
    }

    function clearCart() {
      if (confirm('Yakin ingin mengosongkan keranjang belanja?')) {
        saveCart([]);
        renderCartView();
      }
    }
  </script>
</body>
</html>
