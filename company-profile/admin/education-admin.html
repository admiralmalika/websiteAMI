<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Education Admin | www.admiralmalika.com</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <div class="logo-badge" style="width:36px; height:36px; font-size:1rem;">AM</div>
      <div>
        <div style="font-weight: 800; font-size: 1rem; color: #fff;">CMS ADMIN</div>
        <div style="font-size: 0.7rem; color: #f59e0b;">admiralmalika.com</div>
      </div>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-item"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
      <a href="content-editor.html" class="admin-nav-item"><i class="fas fa-edit"></i> Edit Content & Banner</a>
      <a href="agraria-admin.html" class="admin-nav-item"><i class="fas fa-seedling"></i> Katalog Ekspor Agraria</a>
      <a href="education-admin.html" class="admin-nav-item active"><i class="fas fa-graduation-cap"></i> Program Pendidikan Jerman</a>
      <a href="inquiries.html" class="admin-nav-item"><i class="fas fa-inbox"></i> Pesan / Lead Masuk</a>
      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="../index.html" class="admin-nav-item"><i class="fas fa-globe"></i> Lihat Website Utama</a>
      </div>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--primary-navy);">Pengelola Program Pendidikan Jerman (PT. Elrafa Terang Sejahtera)</h3>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <h4 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 1.5rem;">Program Aktif D3 & D4</h4>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Judul Program</th>
              <th>Kemitraan</th>
              <th>Deskripsi Singkat</th>
            </tr>
          </thead>
          <tbody id="admin-edu-table-body">
            <!-- Rendered from cms.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/cms.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cms = getCMSData();
      const tbody = document.getElementById('admin-edu-table-body');
      tbody.innerHTML = cms.education.map(item => `
        <tr>
          <td style="font-weight:700; color:var(--primary-navy);">${item.title}</td>
          <td><span class="badge-status badge-active"><i class="fas fa-handshake"></i> ${item.partner}</span></td>
          <td style="font-size:0.85rem; color:#475569;">${item.description}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
