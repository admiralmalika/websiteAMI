<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Agraria Catalog Admin | www.admiralmalika.com</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <div class="logo-badge" style="width:36px; height:36px; font-size:1rem;">AM</div>
      <div>
        <div style="font-weight: 800; font-size: 1rem; color: #fff;">CMS ADMIN</div>
        <div style="font-size: 0.7rem; color: #f59e0b;">admiralmalika.com</div>
      </div>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-item"><i class="fas fa-chart-line"></i> Dashboard Overview</a>
      <a href="content-editor.html" class="admin-nav-item"><i class="fas fa-edit"></i> Edit Content & Banner</a>
      <a href="agraria-admin.html" class="admin-nav-item active"><i class="fas fa-seedling"></i> Katalog Ekspor Agraria</a>
      <a href="education-admin.html" class="admin-nav-item"><i class="fas fa-graduation-cap"></i> Program Pendidikan Jerman</a>
      <a href="inquiries.html" class="admin-nav-item"><i class="fas fa-inbox"></i> Pesan / Lead Masuk</a>
      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="../index.html" class="admin-nav-item"><i class="fas fa-globe"></i> Lihat Website Utama</a>
      </div>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--primary-navy);">Pengelola Katalog Ekspor Agraria (B2B)</h3>
      <button class="btn btn-primary btn-sm" onclick="showAddModal()"><i class="fas fa-plus"></i> Tambah Produk B2B</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <h4 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 1.5rem;">Daftar Komoditas Ekspor Agraria</h4>
        
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nama Produk</th>
              <th>Kategori</th>
              <th>Spesifikasi Ekspor</th>
              <th>Badge Label</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-agraria-table-body">
            <!-- Rendered from cms.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/cms.js"></script>
  <script>
    function renderAgrariaTable() {
      const cms = getCMSData();
      const tbody = document.getElementById('admin-agraria-table-body');
      tbody.innerHTML = cms.agraria.map(item => `
        <tr>
          <td style="font-weight:700; color:var(--primary-navy);">${item.name}</td>
          <td><span class="badge-status badge-active">${item.category}</span></td>
          <td style="font-size:0.82rem; color:#475569; max-width:280px;">${item.specs}</td>
          <td><span class="badge-status badge-new">${item.badge}</span></td>
          <td>
            <button class="btn btn-outline btn-sm" style="padding:0.25rem 0.6rem;" onclick="deleteAgrariaItem('${item.id}')"><i class="fas fa-trash"></i> Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteAgrariaItem(id) {
      if (confirm('Yakin ingin menghapus produk ini dari katalog ekspor?')) {
        const cms = getCMSData();
        cms.agraria = cms.agraria.filter(x => x.id !== id);
        saveCMSData(cms);
        renderAgrariaTable();
      }
    }

    function showAddModal() {
      const name = prompt('Nama Produk Agraria (misal: Daun Pisang Frozen Packaging):');
      if (!name) return;
      const category = prompt('Kategori (misal: Food-Grade Packaging / Turunan Kelapa / Turunan Singkong):', 'Food-Grade Packaging');
      const specs = prompt('Spesifikasi Teknis Ekspor:', 'Kemasan: 500g, 1kg Vacuum Bag. Cert: Phytosanitary.');
      const description = prompt('Deskripsi Singkat:', 'Daun pisang segar & pembekuan standar ekspor.');

      const cms = getCMSData();
      cms.agraria.push({
        id: 'ag-' + Date.now(),
        name,
        category,
        specs,
        description,
        badge: 'Produk B2B Baru'
      });
      saveCMSData(cms);
      renderAgrariaTable();
      alert('Produk baru berhasil ditambahkan ke katalog B2B!');
    }

    document.addEventListener('DOMContentLoaded', renderAgrariaTable);
  </script>
</body>
</html>
